apiVersion: orun.io/v1
kind: TaskContract
spec:
  goal: The upstream Hono boilerplate runs as a plain Cloudflare Worker with green checks
  affects:
    - apps/api
    - tests/api
    - pnpm-lock.yaml
    - package.json
    - turbo.json
  doneWhen:
    - pnpm typecheck, lint, test and build are green in Checks
    - wrangler dev answers / with the welcome text and an unknown path with 404
  gates:
    - checks
